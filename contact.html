<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratap Patra</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<div class="container">

    <div class="sidebar sidebarGo">
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about_me.html">About me</a></li>
                <li><a href="/blog.html">Blog</a></li>
                <li><a href="/contact.html"><u>Contact me</u></a></li>
            </ul>
        </nav>
    </div>

    <div class="main">
        <div class="hamberger">
                <img class="ham" src="open.png" alt="" width="23px">
                <img class="cross" src="close.png" alt="" width="23px">
            </div>
        <div class="contact-form">
            <h1>Contact me for work/general enquiry</h1>
            <h1></h1>

            <form>
            <div class="form-group">
                <label for="InputEmail1">Email address</label>
                <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp">
                <small id="emailHelp" class="form-text ">(We'll never share your email with anyone else.)</small>
            </div>
            <div class="form-group">
                <label for="Name">Name</label>
                <input type="name" class="form-control" id="Name">
            </div>
            
            <div class="form-group">
                <label for="PhoneNumber">Phone</label>
                <input type="-phonenumber" class="form-control" id="PhoneNumber">
            </div>
            <div class="form-group">
                <label for="query">Query</label>
                <input type="text" class="form-control" id="query">
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">I want you to work with me on a Project</label>
            </div>
            <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </div>

</div>

</body>
